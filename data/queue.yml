  category: miles_basics
  topic: JGC(JALグローバルクラブ)とは
  caption: '「JGC」って最近よく聞くけど、そもそも何？


    JGC(JALグローバルクラブ)は、JALの上級会員のひとつです。


    ・空港ラウンジ(サクララウンジ)が使える

    ・優先チェックイン、優先保安検査、優先搭乗

    ・手荷物が先に出てくる

    ・ワンワールド加盟の航空会社でも上級会員扱い


    ふつうの上級会員は毎年たくさん乗らないと維持できませんが、JGCはJGCカードを持ち続ける限りずっと使えるのが最大の魅力。

    なり方のカギは「LSP」。次の投稿で解説します。

    ※2026年10月時点。特典の内容は公式サイトで確認してください。'
