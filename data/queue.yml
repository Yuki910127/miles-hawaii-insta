  category: credit_points
  topic: 還元率の意味
  caption: 'クレジットカードの「還元率」、ちゃんと説明できますか？


    100円の支払いで1マイル貯まるなら、還元率1%相当。

    一般的なクレカの還元率は0.5〜1.0%程度が多いです。


    カードを選ぶときは「100円で何マイル？」をまずチェック。'
