- id: 13
  file: '013'
  category: hawaii_tips
  topic: 日本とハワイの時差
  caption: '日本とハワイの時差は19時間。ハワイの方が19時間遅れています。


    日本が朝8時なら、ハワイは前日の午後1時。

    日本が夜8時なら、ハワイは同じ日の深夜1時。


    日本への連絡や、オンライン予約の締め切り時間に気をつけましょう。'
  tags:
  - '#ハワイ時差'
  - '#ハワイ豆知識'
  expect:
