- id: 32
  file: '032'
  category: credit_points
  topic: JALカード特約店でマイル2倍 ＋ JALカードとJAL Payの使い分け
  caption: 'JALカード特約店で支払うと、ショッピングマイルが2倍になります。

    イオンやウエルシアをはじめ、ホテル・レストランなど全国に多数あります。


    プレミアム入会なら 100円＝2マイル、未入会でも 200円＝2マイル。


    ただし、特約店で Apple Pay・Google Pay を使うと一部の店を除いて2倍にならないので注意。

    ※2026年10月時点の公式情報。


    ――――


    JALカードとJAL Pay、どう使い分ける？


    JALカード:200円＝1マイル(プレミアムなら100円＝1マイル)。特約店では2倍。

    JAL Pay:年会費無料のプリペイド決済。国内200円＝1マイル、海外500円＝6マイル、条件達成で最大2.0%。


    JAL Payで払うと特約店の2倍は対象外なので、特約店ではJALカードで払うのがポイントです。

    ※2026年10月時点の公式情報。'
