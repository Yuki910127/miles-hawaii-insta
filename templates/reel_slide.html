<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<style>
{% include "brand.css" %}
/* リールは背景動画の上に透過で重ねる */
html, body { background: transparent; }
.frame { position: relative; width: 1080px; height: 1920px; display: flex; flex-direction: column;
  justify-content: center; align-items: center; padding: 0 90px; background: transparent; }
.frame .brand { position: absolute; top: 200px; left: 0; right: 0; text-align: center; color: var(--white);
  font-size: 34px; font-weight: 700; letter-spacing: .08em; text-shadow: 0 2px 12px rgba(0,0,0,.5); }
.box { background: rgba(255,247,234,.96); border-radius: 40px; padding: 70px 64px; text-align: center;
  box-shadow: 0 20px 60px rgba(0,0,0,.35); width: 100%; }
.hook .box { background: var(--coral); color: var(--white); }
.hook .txt { font-size: 86px; font-weight: 900; line-height: 1.3; }
.line .txt { font-size: 74px; font-weight: 900; line-height: 1.35; color: var(--ink); }
.closing .box { background: var(--ocean); color: var(--white); }
.closing .txt { font-size: 72px; font-weight: 900; line-height: 1.35; }
.counter { margin-top: 36px; font-size: 30px; color: var(--ink-soft); font-weight: 700; letter-spacing: .1em; }
.hook .counter, .closing .counter { color: rgba(255,255,255,.85); }
.frame .handle { position: absolute; bottom: 330px; left: 0; right: 0; text-align: center; color: var(--white);
  font-size: 36px; font-weight: 700; text-shadow: 0 2px 12px rgba(0,0,0,.5); }
</style>
</head>
<body>
<div class="frame {{ kind }}">
  <div class="brand">{{ brand }}</div>
  <div class="box">
    <div class="txt">{{ text | nl2br }}</div>
    {% if kind == "line" %}<div class="counter">{{ idx - 1 }} / {{ total - 2 }}</div>{% endif %}
    {% if kind == "closing" %}<div class="counter">{{ handle }}</div>{% endif %}
  </div>
  <div class="handle">{{ handle }}</div>
</div>
</body>
</html>
